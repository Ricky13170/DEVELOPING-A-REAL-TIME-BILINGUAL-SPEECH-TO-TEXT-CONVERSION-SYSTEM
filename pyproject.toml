[project]
name = "real-time-bilingual-speech-to-text"
version = "0.1.0"
description = "Real-Time Speech to text Vietnam English Lecture hall"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"torch",
	"torchaudio",
	"faster-whisper",
	"ctranslate2",
	"whisperx",
	"pyannote-audio",
	"transformers",
	"accelerate",
	"sentencepiece",
	"safetensors",
	"protobuf",
	"peft",
	"groq",
	"numpy",
	"scipy",
	"soundfile",
	"modal",
	"fastapi",
	"uvicorn",
	"websockets",
	"aiofiles",
	"python-multipart",
	"python-dotenv",
]
